name: Beta Docker Build

on:
  workflow_dispatch:
  push:
    branches:
      - beta

permissions:
  contents: read
  packages: write

concurrency:
  group: beta-docker-${{ github.ref }}
  cancel-in-progress: true

env:
  GHCR_IMAGE: ghcr.io/trifocals3537/tessarr
  BETA_VERSION_BASE: "2.6.0"

jobs:
  build:
    name: Build and publish beta image
    # The repository ID remains stable when the Tessarr repository is renamed.
    if: >-
      github.repository_id == '1173113218' &&
      github.ref == 'refs/heads/beta'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Calculate beta version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! "${BETA_VERSION_BASE}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid BETA_VERSION_BASE: ${BETA_VERSION_BASE}" >&2
            echo "Expected MAJOR.MINOR.PATCH" >&2
            exit 1
          fi

          short_sha="${GITHUB_SHA::7}"
          beta_version="${BETA_VERSION_BASE}-beta.${GITHUB_RUN_NUMBER}.${short_sha}"

          echo "version=${beta_version}" >> "${GITHUB_OUTPUT}"
          echo "Building beta version ${beta_version}"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.GHCR_IMAGE }}
          tags: |
            type=raw,value=beta
            type=raw,value=${{ steps.version.outputs.version }}
          labels: |
            org.opencontainers.image.title=Tessarr
            org.opencontainers.image.description=Self-hosted debrid and Usenet media bridge with qBittorrent and SABnzbd-compatible APIs
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.url=https://github.com/${{ github.repository }}
            org.opencontainers.image.documentation=https://github.com/${{ github.repository }}/blob/${{ github.sha }}/README.md
            org.opencontainers.image.authors=Tessarr contributors
            org.opencontainers.image.licenses=MIT

      - name: Build and push multi-platform image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
            CHANNEL=beta
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha,scope=beta
          cache-to: type=gha,scope=beta,mode=max
          provenance: mode=max
          sbom: true
